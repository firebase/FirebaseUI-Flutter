name: forui_firebase_ui_database
description: Pre-built widgets and utilites that make it easy to integrate Firebase Realtime Database into your Flutter app.
version: 0.1.0
homepage: https://github.com/gnomezgrave/forui_FirebaseUI-Flutter/tree/main/packages/firebase_ui_database

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  collection: ^1.18.0
  firebase_database: ^13.0.0
  forui_firebase_ui_localizations: ^0.1.0
  forui_firebase_ui_shared: ^0.1.0
  flutter:
    sdk: flutter

  material_ui: ^1.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

false_secrets:
  - "/example/**/google-services.json"
  - "/example/**/firebase_options.dart"
  - "/example/**/GoogleService-Info.plist"

# The following section is specific to Flutter packages.
