name: firebase_ui_oauth_twitter
description: Firebase UI widgets for authentication & OAuth.
version: 3.0.0
homepage: https://github.com/firebase/FirebaseUI-Flutter/tree/master/packages/firebase_ui_oauth_twitter

resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^7.0.0
  firebase_ui_oauth: ^3.0.0
  vector_graphics_compiler: ^1.1.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

false_secrets:
  - "/example/**/google-services.json"
  - "/example/**/firebase_options.dart"
  - "/example/**/GoogleService-Info.plist"

# The following section is specific to Flutter packages.
flutter:
  # SVG icons are compiled to the vector_graphics binary format at build
  # time, so the output always matches the app's resolved codec version.
  assets:
    - path: assets/icons/twitter.svg
      transformers:
        - package: vector_graphics_compiler
