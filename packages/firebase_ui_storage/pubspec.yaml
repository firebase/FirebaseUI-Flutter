name: forui_firebase_ui_storage
description: Pre-built widgets and utilites that make it easy to integrate Firebase Storage into your Flutter app.
version: 0.1.0
homepage: https://github.com/gnomezgrave/forui_FirebaseUI-Flutter/tree/main/packages/firebase_ui_storage/

environment:
  sdk: ^3.13.0
  flutter: ">=3.10.0"

resolution: workspace

false_secrets:
  - example/**

dependencies:
  flutter:
    sdk: flutter
  firebase_storage: ^14.0.0
  forui_firebase_ui_localizations: ^0.1.0
  forui_firebase_ui_shared: ^0.1.0
  forui: ^0.27.0
  path: ^1.8.3
  uuid: ^4.2.2
  file_selector: ^1.0.1
  flutter_blurhash: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4

flutter:
