plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace = "io.flutter.plugins.firebase.tests"
    // use "flutter.compileSdkVersion" and bump AGP once twitter_login has released v4.4.3: https://github.com/0maru/twitter_login/issues/139
    compileSdk 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "io.flutter.plugins.firebase.tests"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

configurations.all {
    resolutionStrategy {
        // flutter_web_auth_2 (used by firebase_ui_oauth) directly depends on
        // androidx.browser 1.9.0 and androidx.activity:activity-ktx 1.10.1,
        // both of which require AGP 8.9.1+ (as does the androidx.core they
        // pull in transitively). Force the whole set down to older,
        // mutually-compatible versions until AGP can be bumped (blocked on
        // twitter_login releasing a fix, see the compileSdk comment above).
        force "androidx.browser:browser:1.8.0"
        force "androidx.activity:activity-ktx:1.9.3"
        force "androidx.activity:activity:1.9.3"
        force "androidx.core:core:1.13.1"
        force "androidx.core:core-ktx:1.13.1"
    }
}
