name: tests
description: Testing project for firebase_ui
publish_to: "none"
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  forui: ^0.27.0
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  forui_firebase_ui_auth: ^0.1.0
  forui_firebase_ui_localizations: ^0.1.0
  forui_firebase_ui_oauth_apple: ^0.1.0
  forui_firebase_ui_oauth_facebook: ^0.1.0
  forui_firebase_ui_oauth_google: ^0.1.0
  forui_firebase_ui_oauth: ^0.1.0
  flutter_facebook_auth: ^7.3.2
  forui_firebase_ui_oauth_twitter: ^0.1.0
  cloud_firestore: ^7.0.0
  forui_firebase_ui_firestore: ^0.1.0
  http: ^1.1.2
  google_sign_in: ^7.1.0
  forui_firebase_ui_shared: ^0.1.0
  firebase_database: ^13.0.0
  forui_firebase_ui_database: ^0.1.0

  material_ui: ^1.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # SPM: Firebase iOS SDK 13 needs GTMSessionFetcher 4.x, but google_sign_in_ios
  # still pins GoogleSignIn 9.x (Fetcher 3.x). Use CocoaPods (Firebase 12.19)
  # until google_sign_in_ios depends on GoogleSignIn >= 10.1.
  config:
    enable-swift-package-manager: false
